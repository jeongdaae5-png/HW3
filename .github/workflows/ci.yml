name: Build and publish Docker image
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.7'}
      - name: Validate and test
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile disk_analyzer.py disk_analyzerD.py
          d="$(mktemp -d)"
          printf 'same-content' > "$d/a.txt"
          cp "$d/a.txt" "$d/b.txt"
          truncate -s 3221225472 "$d/limit.bin"
          out="$(python disk_analyzerD.py "$d" --no-color --inactive-days 0)"
          grep -q 'Duplicate groups: 1' <<< "$out"
          grep -q 'WARNING: directory exceeds 3 GiB' <<< "$out"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: github.event_name == 'push'
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/disk-analyzer
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
