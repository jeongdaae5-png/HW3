name: Build and publish Docker image

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/hw3:latest

  deploy:
    needs: test-and-publish
    runs-on: self-hosted
    steps:
      - name: Deploy Docker Container
        shell: powershell
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hw3:latest
          docker stop my-api -ErrorAction SilentlyContinue
          docker rm my-api -ErrorAction SilentlyContinue
          docker run -d -p 8000:8000 --name my-api ${{ secrets.DOCKERHUB_USERNAME }}/hw3:latest